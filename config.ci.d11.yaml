# GitHub Actions 递减阶梯 11 天档：2026-10-27→2026-11-06（从 10/27 起连住 11 晚），仅个人，全区
# 阶梯逻辑：15/13/11/9/7/5/3/2 各一档，某一档"从无到有"就推。
# 能住更长天数的驿站会同时出现在更低档位，属于预期（各组独立去重）。
# 不含密钥；Bark key 由 Actions Secret（BARK_URL）注入。

base_url: "https://qnyz.shyouth.net/qnyzApi"
verify_ssl: false
check_availability: true
concurrency: 10

filters:
  name: ""
  user_type: 2
  apply_scope: "personal"
  districts: []          # 全区兜底；市区增量由 B 组（config.ci.b.yaml）实时盯
  only_stations: []
  date_from: "2026-10-27"
  date_to: "2026-11-06"
  min_house_count: 0
  min_apply_number: 1

notify:
  type: "bark"
  url: ""          # 由环境变量 QNYZ_NOTIFY_URL 注入

log_file: ""
