# GitHub Actions 监控组 A：理想区间 10/27→11/10（15 晚），仅个人，全区
# 探查结论（2026-10-25）：全部 92 家日历最早只开到 10/27；全市能连住 15 天的
# 只有 6 家（崇明/金山/青浦），市区 0 家。本组盯"能住满 15 天"的从无到有。
# 不含密钥；Bark key 由 Actions Secret（BARK_URL）注入。

base_url: "https://qnyz.shyouth.net/qnyzApi"
verify_ssl: false
check_availability: true
concurrency: 10

filters:
  name: ""
  user_type: 2
  apply_scope: "personal"
  districts: []
  only_stations: []
  date_from: "2026-10-27"
  date_to: "2026-11-10"
  min_house_count: 0
  min_apply_number: 1

notify:
  type: "bark"
  url: ""          # 由环境变量 QNYZ_NOTIFY_URL 注入

log_file: ""
