name: qnyz-monitor

on:
  # 定时两条路，二选一。当前用的是【替代】GitHub 自带 schedule：
  #   - 不需要 PAT、不需要外部服务；但不保证准点，实测常延迟甚至整轮跳过。
  #   - 仓库 60 天无 push，GitHub 会自动停用 schedule（重新 enable 或 push 保活）。
  #   - 想要准点、5 分钟一次的，改回外部定时服务方案，见 README「定时触发」，
  #     并把下面 schedule 两行重新注释掉。
  schedule:
    - cron: "23 * * * *"      # 每小时一次（UTC 时间，非北京时间）
  workflow_dispatch: {}       # 手动触发入口

permissions:
  contents: read

concurrency:
  group: qnyz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # 一组失败不影响另一组
      matrix:
        include:
          # 递减阶梯：从 10/27 起连住 N 晚，各档独立去重，"从无到有"即推
          # （能住更长的会同时出现在更低档位，属预期）
          - name: A15          # 15 晚：10/27→11/10（理想档）
            config: config.ci.a.yaml
          - name: D13          # 13 晚：10/27→11/08
            config: config.ci.d13.yaml
          - name: D11          # 11 晚：10/27→11/06
            config: config.ci.d11.yaml
          - name: D9           # 9 晚：10/27→11/04
            config: config.ci.d9.yaml
          - name: D7           # 7 晚：10/27→11/02
            config: config.ci.d7.yaml
          - name: D5           # 5 晚：10/27→10/31
            config: config.ci.d5.yaml
          - name: D3           # 3 晚：10/27→10/29
            config: config.ci.d3.yaml
          - name: D2           # 2 晚：10/27→10/28（阶梯地板）
            config: config.ci.d2.yaml
          - name: B            # 市区 7 区逐日增量（不设日期，优先盯市区）
            config: config.ci.b.yaml
    name: check-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests PyYAML

      # 每组独立的去重缓存（key 前缀含组名，互不覆盖）
      - name: Restore dedup state (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: state.json
          key: qnyz-state-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            qnyz-state-${{ matrix.name }}-

      - name: Run check (${{ matrix.name }})
        env:
          QNYZ_NOTIFY_URL: ${{ secrets.BARK_URL }}
        run: python monitor.py --once --config ${{ matrix.config }}
